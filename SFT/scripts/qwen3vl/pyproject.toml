[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-o3-video-v2-sft"
version = "0.1.0"
description = "Open-o3-Video-v2 Qwen3-VL SFT environment"
requires-python = ">=3.12"
dependencies = [
    "ms-swift==4.0.2",
    "decord==0.6.0",
    "datasets>=3.0,<4.0",
    "deepspeed>=0.18.2",
    "einops>=0.8.1",
    "flash-attn==2.8.3",
    "json-repair>=0.53.0",
    "mcore-bridge>=1.3,<1.7",
    "megatron-core>=0.16,<0.20",
    "modelscope>=1.32.0",
    "msgspec>=0.19.0",
    "ninja>=1.11",
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "peft>=0.18.0",
    "pydantic>=2.12.4",
    "qwen-vl-utils==0.0.14",
    "ray>=2.51.1",
    "torch==2.8.0",
    "torchcodec==0.6",
    "torchvision==0.23.0",
    "transformer-engine[pytorch]==2.10.0",
    "transformers==4.57.0",
    "wandb>=0.23.1",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv]
package = false
no-build-isolation-package = ["flash-attn", "transformer-engine-torch"]
